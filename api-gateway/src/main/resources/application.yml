server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: http://auth-service:8081
            predicates:
              - Path=/api/auth/**
          - id: tour-service
            uri: http://tour-service:8082
            predicates:
              - Path=/api/tours/**
          - id: booking-service
            uri: http://booking-service:8083
            predicates:
              - Path=/api/solicitudes/**

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

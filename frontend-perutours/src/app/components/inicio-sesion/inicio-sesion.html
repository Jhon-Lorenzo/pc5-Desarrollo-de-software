<div class="container">
    <h2>Iniciar Sesión</h2>
    <p class="text-muted">Ingrese sus credenciales para acceder al sistema.</p>

    <div *ngIf="errorMsg" class="alert alert-error">
        {{ errorMsg }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()">
        <div class="form-group">
            <label for="login-email">Correo Electrónico</label>
            <input type="email" id="login-email" formControlName="email" placeholder="ejemplo@mail.com">
        </div>
        <div class="form-group">
            <label for="login-password">Contraseña</label>
            <input type="password" id="login-password" formControlName="contrasena" placeholder="Ingrese su contraseña">
        </div>
        <div class="form-group">
            <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid || loading">
                {{ loading ? 'Ingresando...' : 'Ingresar' }}
            </button>
            <button type="button" class="btn btn-secondary" routerLink="/">Volver</button>
        </div>
    </form>

    <div class="mt-15">
        <p class="text-muted" style="font-size:0.85rem;">
            ¿No tiene cuenta? 
            <a class="link-primary" routerLink="/registro">Regístrese aquí</a>
        </p>
        <p class="text-muted" style="font-size:0.8rem; margin-top:10px; background:#f0f0f0; padding:10px; border-radius:4px;">
            <strong>Usuarios Demo (Backend real):</strong><br>
            Socio: socio@perutours.com / 123456<br>
            Agente: agente@perutours.com / 123456<br>
            Gerente: gerente@perutours.com / 123456
        </p>
    </div>
</div>
